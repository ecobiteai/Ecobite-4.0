<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoBite — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="eco-motion.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  body.app-page{background:var(--paper);overflow-x:hidden;}
  .app-shell{min-height:100vh;display:grid;grid-template-columns:264px minmax(0,1fr);}
  .sidebar{position:sticky;top:0;height:100vh;z-index:60;display:flex;flex-direction:column;padding:24px 18px;background:var(--bg-deep);color:var(--paper);overflow-y:auto;}
  .sidebar-brand{display:flex;align-items:center;gap:10px;padding:0 10px;text-decoration:none;}
  .sidebar-brand img{width:30px;height:30px;}
  .sidebar-brand span{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:600;}
  .sidebar-city{margin:30px 10px 18px;color:rgba(242,239,226,.5);font-size:.78rem;letter-spacing:.03em;}
  .side-section{margin-top:20px;}
  .side-label{display:block;padding:0 12px 7px;color:rgba(242,239,226,.42);font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;}
  .side-nav{position:relative;display:grid;gap:3px;}
  .side-nav::before{content:"";position:absolute;left:17px;top:10px;bottom:10px;width:1px;background:rgba(242,239,226,.14);}
  .side-link{position:relative;display:flex;align-items:center;gap:11px;width:100%;min-height:42px;padding:8px 10px 8px 12px;border:1px solid transparent;border-radius:12px;background:transparent;color:rgba(242,239,226,.68);font-size:.86rem;text-align:left;transition:background .22s ease,color .22s ease,transform .22s var(--ease);}
  .side-link:hover{color:var(--paper);background:rgba(242,239,226,.08);transform:translateX(2px);}
  .side-link[aria-current="page"]{color:var(--paper);background:rgba(210,232,198,.16);border-color:rgba(139,195,74,.18);}
  .side-link .node{position:relative;z-index:1;width:11px;height:11px;flex:none;border:2px solid rgba(242,239,226,.35);border-radius:50%;background:var(--bg-deep);transition:background .25s ease,border-color .25s ease,box-shadow .25s ease,transform .25s var(--ease);}
  .side-link[aria-current="page"] .node{background:var(--leaf-bright);border-color:var(--leaf-bright);box-shadow:0 0 0 4px rgba(139,195,74,.14);transform:scale(1.1);}
  .side-link[data-alert="true"] .node{background:var(--orange);border-color:var(--orange);}
  .side-link svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.9;}
  .sidebar-footer{margin-top:auto;padding-top:24px;border-top:1px solid rgba(242,239,226,.14);display:grid;gap:4px;}
  .sidebar-footer .side-link{font-size:.82rem;}
  .account-mini{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px;border-radius:12px;background:rgba(242,239,226,.07);color:var(--paper);}
  .avatar{width:32px;height:32px;display:grid;place-items:center;flex:none;border-radius:50%;background:linear-gradient(140deg,var(--leaf-bright),var(--leaf));color:#10230F;font-weight:800;font-size:.8rem;}
  .account-mini strong{display:block;font-size:.8rem;line-height:1.2;}
  .account-mini small{display:block;margin-top:2px;color:rgba(242,239,226,.5);font-size:.7rem;}
  .app-main{min-width:0;}
  .app-mobile-bar{display:none;}
  .app-topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;min-height:78px;padding:15px clamp(20px,4vw,46px);background:rgba(242,239,226,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);}
  .search-wrap{position:relative;flex:1;max-width:640px;}
  .search-wrap>svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);fill:none;stroke:var(--ink-soft);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;}
  .search-wrap input{min-height:44px;padding-left:42px;padding-right:56px;border-radius:999px;background:rgba(255,253,246,.72);}
  .search-shortcut{position:absolute;right:13px;top:50%;transform:translateY(-50%);padding:2px 7px;border:1px solid var(--line);border-radius:6px;color:var(--text-faint);font-size:.7rem;}
  .search-results{position:absolute;left:0;right:0;top:calc(100% + 9px);display:none;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);}
  .search-results.show{display:block;animation:popIn .25s var(--ease) both;}
  .search-group{padding:5px 0 9px;}
  .search-group+.search-group{border-top:1px solid var(--line);}
  .search-group>strong{display:block;padding:4px 10px;color:var(--text-faint);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;}
  .search-result{display:flex;width:100%;gap:10px;padding:9px 10px;border:0;border-radius:10px;background:transparent;color:var(--ink);text-align:left;transition:background .18s ease;}
  .search-result:hover,.search-result:focus-visible{background:var(--sage);outline:0;}
  .search-result strong{display:block;font-size:.86rem;}
  .search-result span{display:block;color:var(--text-faint);font-size:.76rem;}
  .top-context{display:flex;align-items:center;gap:12px;margin-left:auto;}
  .top-context small{color:var(--text-faint);font-size:.78rem;}
  .top-account{display:flex;align-items:center;gap:9px;white-space:nowrap;}
  .top-account .avatar{width:34px;height:34px;}
  .top-account strong{display:block;font-size:.8rem;line-height:1.2;}
  .top-account small{display:block;margin-top:2px;color:var(--text-faint);font-size:.7rem;}
  .app-content{max-width:1400px;margin:0 auto;padding:0 clamp(20px,4vw,52px) 64px;}
  .greeting{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:50px 0 28px;}
  .greeting h1{font-size:clamp(2rem,4vw,3.2rem);margin-bottom:8px;}
  .greeting p{max-width:62ch;color:var(--ink-soft);}
  .greeting-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:13px;color:var(--text-faint);font-size:.86rem;}
  .ai-quote-label{display:block;color:var(--leaf);font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;}
  .ai-quote{display:flex;align-items:center;flex-wrap:wrap;gap:7px;min-height:1.5em;max-width:62ch;color:var(--ink-soft);font-family:'Fraunces',serif;font-size:1.05rem;font-style:italic;}
  .ai-quote-icon{flex:none;font-style:normal;font-size:.95em;}
  .ai-caret{display:inline-block;width:2px;height:1.05em;background:var(--leaf);vertical-align:-3px;animation:aiCaretBlink 1s steps(1,end) infinite;}
  .ai-caret.done{opacity:0;transition:opacity .5s ease .2s;}
  @keyframes aiCaretBlink{0%,49%{opacity:1;}50%,100%{opacity:0;}}
  @media (prefers-reduced-motion:reduce){ .ai-caret{animation:none;opacity:0;} }

  /* ---------- Ambient animated backdrop for the app shell ---------- */
  .app-content{position:relative;}
  .app-content::before{content:"";position:fixed;z-index:-1;inset:0;pointer-events:none;background:
    radial-gradient(560px circle at 6% 0%, rgba(114,170,63,.10), transparent 60%),
    radial-gradient(480px circle at 98% 14%, rgba(242,153,74,.09), transparent 55%);}
  .greeting{position:relative;}
  .greeting::before{content:"";position:absolute;z-index:-1;right:-30px;top:-34px;width:200px;height:200px;border:1px solid rgba(79,154,82,.16);border-radius:50%;animation:greetOrbit 22s ease-in-out infinite alternate;}
  @keyframes greetOrbit{from{transform:rotate(-8deg) translate3d(0,0,0);}to{transform:rotate(8deg) translate3d(-1.4vw,-1.1vh,0);}}

  /* ---------- Predictive AI outlook card ---------- */
  .predict-card{position:relative;overflow:hidden;padding:22px 22px 20px;border-radius:20px;background:linear-gradient(160deg,var(--bg-deep) 0%,var(--bg-deep-3) 100%);color:var(--paper);box-shadow:0 22px 50px -34px rgba(21,35,26,.7);transition:transform .3s var(--ease),box-shadow .3s ease;}
  .predict-card:hover{transform:translateY(-4px);box-shadow:0 28px 60px -32px rgba(21,35,26,.8);}
  .predict-card::before{content:"";position:absolute;inset:-40% -10% auto auto;width:220px;height:220px;background:radial-gradient(circle,rgba(139,195,74,.35),transparent 70%);animation:predictGlow 6s ease-in-out infinite;pointer-events:none;}
  @keyframes predictGlow{0%,100%{opacity:.5;transform:scale(1);}50%{opacity:1;transform:scale(1.12);}}
  .predict-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:relative;}
  .predict-label{display:flex;align-items:center;gap:7px;color:var(--leaf-bright);font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;}
  .predict-dot{width:7px;height:7px;border-radius:50%;background:var(--leaf-bright);box-shadow:0 0 0 4px rgba(139,195,74,.22);animation:predictPulse 1.8s ease-in-out infinite;}
  @keyframes predictPulse{0%,100%{box-shadow:0 0 0 4px rgba(139,195,74,.22);}50%{box-shadow:0 0 0 8px rgba(139,195,74,.05);}}
  .predict-range{display:flex;align-items:baseline;gap:10px;margin:15px 0 3px;position:relative;}
  .predict-count{font-family:'Fraunces',serif;font-size:clamp(2.2rem,5vw,3.1rem);line-height:1;}
  .predict-count small{font-family:'Inter',sans-serif;font-size:.34em;color:rgba(242,239,226,.6);margin-left:7px;font-weight:600;}
  .predict-headline{margin-top:7px;font-family:'Fraunces',serif;font-size:1.06rem;position:relative;}
  .predict-reason{margin-top:6px;color:rgba(242,239,226,.68);font-size:.83rem;line-height:1.55;position:relative;}
  .predict-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px;position:relative;}
  .predict-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:rgba(242,239,226,.09);border:1px solid rgba(242,239,226,.14);font-size:.74rem;color:rgba(242,239,226,.85);transition:background .2s ease,transform .2s var(--ease);}
  .predict-badge:hover{background:rgba(242,239,226,.16);transform:translateY(-1px);}
  .predict-meter{height:5px;margin-top:16px;border-radius:5px;background:rgba(242,239,226,.14);overflow:hidden;position:relative;}
  .predict-meter i{display:block;height:100%;width:0%;border-radius:inherit;background:linear-gradient(90deg,var(--leaf-bright),var(--orange));transition:width 1.1s var(--ease);}
  .predict-meter-label{display:flex;justify-content:space-between;margin-top:6px;color:rgba(242,239,226,.5);font-size:.68rem;}
  @media (prefers-reduced-motion:reduce){
    .predict-card::before,.predict-dot,.greeting::before{animation:none;}
    .predict-card:hover,.predict-badge:hover{transform:none;}
  }
  .impact-ledger{display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden;margin-bottom:30px;border:1px solid var(--line-strong);border-radius:18px;background:var(--surface);box-shadow:0 16px 40px -36px rgba(21,35,26,.6);}
  .impact-cell{padding:20px 22px;border-right:1px solid var(--line);}
  .impact-cell:last-child{border-right:0;}
  .impact-cell strong{display:block;font-family:'Fraunces',serif;font-size:clamp(1.5rem,2.5vw,2.1rem);line-height:1.05;}
  .impact-cell strong small{font-family:'Inter',sans-serif;font-size:.48em;color:var(--text-soft);margin-left:4px;}
  .impact-cell span{display:block;margin-top:7px;color:var(--text-faint);font-size:.78rem;}
  .home-grid{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(300px,.82fr);gap:26px;align-items:start;}
  .home-primary,.home-secondary{display:grid;gap:26px;min-width:0;}
  .sheet{padding:24px;background:rgba(255,253,246,.72);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 45px -40px rgba(21,35,26,.55);}
  .sheet.sage{background:var(--sage);}
  .sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px;}
  .sheet-head h2{font-size:1.25rem;}
  .sheet-head p{margin-top:5px;color:var(--text-faint);font-size:.83rem;}
  .filter-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:17px;}
  .filter-tab{min-height:34px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink-soft);font-size:.76rem;font-weight:700;transition:background .2s ease,border-color .2s ease,color .2s ease;}
  .filter-tab:hover,.filter-tab.on{background:var(--sage-strong);border-color:var(--leaf);color:var(--ink);}
  .offer-list{display:grid;}
  .offer-row{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto auto;gap:14px;align-items:center;padding:16px 0;border-top:1px solid var(--line);transition:background .25s ease,transform .25s var(--ease);}
  .offer-row:first-child{border-top:0;}
  .offer-row:hover{background:rgba(225,240,216,.45);transform:translateX(3px);}
  .offer-row.urgent{border-top-color:rgba(225,87,63,.26);}
  .category-dot{width:10px;height:10px;border-radius:50%;background:var(--leaf);}
  .category-dot.prepared{background:var(--orange);}
  .category-dot.bakery{background:#A59A78;}
  .category-dot.chilled{background:var(--aqua);}
  .offer-row h3{font-family:'Inter',sans-serif;font-size:.9rem;font-weight:700;line-height:1.3;}
  .offer-row .where{display:block;margin-top:3px;color:var(--text-faint);font-size:.76rem;}
  .offer-qty{text-align:right;color:var(--text-soft);font-size:.78rem;white-space:nowrap;}
  .offer-qty strong{display:block;color:var(--ink);font-size:.9rem;}
  .time-chip{padding:6px 9px;border-radius:999px;background:rgba(21,35,26,.07);color:var(--ink-soft);font-size:.72rem;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .time-chip.warm{background:rgba(242,153,74,.16);color:var(--orange-deep);}
  .time-chip.urgent{background:rgba(225,87,63,.14);color:#B94735;animation:urgent 2.2s ease-in-out infinite;}
  .offer-row.claimed{opacity:.66;}
  .offer-row.claimed .offer-action{display:none;}
  .claimed-state{display:none;color:var(--leaf);font-size:.78rem;font-weight:800;}
  .offer-row.claimed .claimed-state{display:inline-flex;align-items:center;gap:5px;}
  .offer-row.claimed .claimed-state::before{content:"✓";display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:rgba(79,154,82,.14);}
  .offer-action{min-height:34px;padding:6px 12px;font-size:.76rem;}
  .empty-note{padding:28px 0;color:var(--text-faint);font-size:.86rem;}
  .ai-stack{display:grid;gap:14px;}
  .ai-note{position:relative;padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden;transition:transform .25s var(--ease),box-shadow .25s ease,border-color .25s ease;}
  .ai-note:hover{transform:translateY(-4px);border-color:rgba(79,154,82,.45);box-shadow:0 18px 36px -30px rgba(21,35,26,.65);}
  .ai-note.forecast{background:var(--sage);}
  .ai-note.match{background:#F4F0E5;}
  .ai-note.routing-note,.ai-note.route{display:block;background:var(--bg-deep);color:var(--paper);}
  .ai-note .ai-label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;color:var(--leaf);font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;}
  .ai-note.routing-note .ai-label,.ai-note.route .ai-label{color:var(--leaf-bright);}
  .ai-note h3{font-family:'Fraunces',serif;font-size:1.2rem;margin-bottom:8px;}
  .ai-note p{color:var(--text-soft);font-size:.82rem;line-height:1.5;}
  .ai-note.routing-note p,.ai-note.route p{color:rgba(242,239,226,.7);}
  .ai-note .ai-action{display:inline-flex;align-items:center;margin-top:15px;padding:0;border:0;background:none;color:var(--leaf);font-size:.78rem;font-weight:800;text-decoration:underline;text-underline-offset:3px;}
  .ai-note .ai-action svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-left:5px;}
  .ai-note.routing-note .ai-action,.ai-note.route .ai-action{color:var(--orange);}
  .mini-bars{display:flex;align-items:flex-end;gap:5px;height:54px;margin:16px 0 4px;}
  .mini-bars span{flex:1;height:var(--bar);min-height:8px;border-radius:4px 4px 2px 2px;background:var(--leaf);opacity:.7;}
  .mini-bars span.peak{background:var(--orange);opacity:1;}
  .mini-bars-labels{display:flex;gap:5px;color:var(--text-faint);font-size:.63rem;}
  .mini-bars-labels span{flex:1;text-align:center;}
  .match-route{display:flex;align-items:center;gap:7px;margin:14px 0;color:var(--ink-soft);font-size:.78rem;font-weight:700;}
  .match-route i{width:8px;height:8px;border-radius:50%;background:var(--leaf);}
  .match-route i:last-child{background:var(--orange);}
  .match-route b{height:1px;flex:1;background:var(--line-strong);}
  .ticket-route{display:flex;align-items:center;gap:6px;margin:15px 0 7px;}
  .ticket-route i{width:9px;height:9px;border-radius:50%;background:var(--leaf-bright);}
  .ticket-route i.current{background:var(--orange);box-shadow:0 0 0 4px rgba(242,153,74,.16);}
  .ticket-route b{height:2px;flex:1;background:rgba(242,239,226,.24);}
  .ticket-meta{display:flex;justify-content:space-between;color:rgba(242,239,226,.56);font-size:.68rem;}
  .capacity-list{display:grid;}
  .capacity-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:13px;padding:14px 0;border-top:1px solid var(--line);}
  .capacity-row:first-child{border-top:0;}
  .capacity-row strong{display:block;font-size:.84rem;}
  .capacity-row span{display:block;margin-top:3px;color:var(--text-faint);font-size:.73rem;}
  .capacity-value{text-align:right;color:var(--ink-soft);font-size:.76rem;font-weight:800;}
  .meter{height:5px;margin-top:9px;border-radius:5px;background:rgba(21,35,26,.12);overflow:hidden;}
  .meter i{display:block;height:100%;width:var(--capacity);border-radius:inherit;background:var(--leaf);}
  .meter i.high{background:var(--orange);}
  .meter i.full{background:var(--tomato);}

  /* ---------- Secondary views ---------- */
  .view-intro{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:50px 0 28px;}
  .view-intro h1{font-size:clamp(2rem,4vw,3rem);margin-bottom:8px;}
  .view-intro p{max-width:62ch;color:var(--text-soft);}
  .view-board{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr);gap:26px;align-items:start;}
  .form-sheet{position:relative;overflow:hidden;max-width:780px;padding:30px 28px 28px;border-radius:20px;box-shadow:var(--shadow);
    background:radial-gradient(rgba(21,35,26,.045) 1px, transparent 1px) 0 0/16px 16px, rgba(255,253,246,.86);
    border:1px solid var(--line);transition:box-shadow .3s ease;}
  .form-sheet:hover{box-shadow:0 30px 60px -34px rgba(21,35,26,.6);}
  .form-sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--leaf),var(--leaf-bright),var(--orange),var(--leaf));background-size:200% 100%;animation:sheetBarFlow 7s linear infinite;}
  @keyframes sheetBarFlow{to{background-position:-200% 0;}}
  .form-sheet h2{font-size:1.25rem;margin-bottom:6px;}
  .form-sheet>p{color:var(--text-faint);font-size:.84rem;margin-bottom:22px;}
  .category-picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:9px;margin-bottom:20px;}
  .category-choice{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px 8px;line-height:1.25;}
  .category-choice b{font-size:1.15rem;line-height:1;}
  .category-choice span{display:block;font-size:.76rem;}
  @media (max-width:560px){ .category-picker{grid-template-columns:repeat(2,1fr);} }
  .category-choice{position:relative;overflow:hidden;min-height:54px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.55);color:var(--ink-soft);font-size:.78rem;font-weight:800;transition:background .2s ease,border-color .2s ease,transform .2s var(--ease),box-shadow .2s ease;}
  .category-choice::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle,rgba(114,170,63,.35),transparent 65%);opacity:0;transform:scale(.5);transition:opacity .4s ease,transform .4s ease;pointer-events:none;}
  .category-choice:hover{transform:translateY(-2px);border-color:var(--leaf);}
  .category-choice.on{background:linear-gradient(135deg,var(--sage),rgba(242,153,74,.14));border-color:var(--leaf);color:var(--ink);transform:translateY(-2px);box-shadow:0 14px 26px -18px rgba(79,154,82,.65);animation:chipPop .35s var(--ease);}
  .category-choice.on::before{opacity:1;transform:scale(1.3);}
  @media (prefers-reduced-motion:reduce){
    .form-sheet::before{animation:none;}
    .category-choice.on{animation:none;}
    .category-choice:hover,.form-sheet:hover{transform:none;}
  }
  .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface);}
  .record-table{width:100%;border-collapse:collapse;min-width:680px;}
  .record-table th,.record-table td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--line);font-size:.8rem;vertical-align:middle;}
  .record-table th{color:var(--text-faint);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;}
  .record-table tbody tr:last-child td{border-bottom:0;}
  .record-table tbody tr:hover{background:var(--sage);}
  .record-table td strong{display:block;font-size:.84rem;}
  .record-table td span{display:block;color:var(--text-faint);font-size:.73rem;margin-top:2px;}
  .status-text{font-weight:800;color:var(--leaf);}
  .status-text.waiting{color:var(--orange-deep);}
  .status-text.done{color:var(--ink-soft);}
  .route-board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .route-column{min-width:0;padding:18px;background:var(--sage);border:1px solid var(--line);border-radius:18px;}
  .route-column h2{font-size:1rem;margin-bottom:14px;}
  .route-ticket{padding:16px;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 28px -28px rgba(21,35,26,.8);}
  .route-ticket:first-of-type{margin-top:0;}
  .route-ticket strong{display:block;font-size:.88rem;}
  .route-ticket span{display:block;margin-top:4px;color:var(--text-faint);font-size:.75rem;}
  .route-ticket .btn{margin-top:13px;width:100%;}
  .detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
  .detail-cell{padding:17px;background:var(--sage);border:1px solid var(--line);border-radius:14px;}
  .detail-cell strong{display:block;font-family:'Fraunces',serif;font-size:1.2rem;}
  .detail-cell span{display:block;margin-top:4px;color:var(--text-faint);font-size:.76rem;}
  /* ---- profile: photo, role picker, support ---- */
  .avatar{overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  .avatar.has-photo{background:none;}
  .avatar-edit{display:flex;align-items:center;gap:18px;margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--line);}
  .avatar-preview{display:grid;place-items:center;width:78px;height:78px;flex:none;border-radius:50%;overflow:hidden;background:linear-gradient(140deg,var(--leaf-bright),var(--leaf));color:#10230F;font-family:'Fraunces',serif;font-size:1.8rem;font-weight:700;}
  .avatar-preview img{width:100%;height:100%;object-fit:cover;}
  .avatar-edit-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
  .avatar-edit-actions .help{flex-basis:100%;margin:0;}
  .form-subhead{margin:26px 0 12px;font-family:'Fraunces',serif;font-size:1.05rem;color:var(--ink);}
  .form-hint{margin:-6px 0 12px;color:var(--text-faint);font-size:.8rem;}
  .role-picker{display:grid;gap:10px;margin-bottom:6px;}
  .role-choice input{position:absolute;opacity:0;width:1px;height:1px;}
  .role-choice>span{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:14px;padding:13px 16px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:rgba(255,255,255,.42);cursor:pointer;transition:border-color .2s ease,background .2s ease;}
  .role-choice>span:hover{border-color:var(--leaf);background:var(--surface);}
  .role-choice b{font-size:1.25rem;font-weight:400;}
  .role-choice strong{display:block;font-size:.9rem;}
  .role-choice small{display:block;color:var(--text-faint);font-size:.76rem;grid-column:2;}
  .role-choice input:checked+span{border-color:var(--leaf);background:rgba(114,170,63,.12);box-shadow:0 0 0 3px rgba(114,170,63,.12);}
  .role-choice input:focus-visible+span{outline:2px solid var(--leaf);outline-offset:3px;}
  .profile-side{display:grid;gap:22px;align-content:start;}
  .support-list{display:grid;}
  .support-row{display:grid;grid-template-columns:26px 1fr;gap:13px;align-items:center;width:100%;padding:14px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;text-decoration:none;color:inherit;cursor:pointer;transition:opacity .2s ease;}
  .support-row:first-child{border-top:0;}
  .support-row:hover{opacity:.72;}
  .support-row i{font-style:normal;font-size:1.1rem;}
  .support-row strong{display:block;font-size:.88rem;}
  .support-row small{display:block;margin-top:2px;color:var(--text-faint);font-size:.76rem;line-height:1.4;}
  .support-note{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);color:var(--text-faint);font-size:.76rem;}
  .alert-list{display:grid;}
  .alert-row{display:grid;grid-template-columns:9px 1fr;gap:12px;padding:13px 0;border-top:1px solid var(--line);}
  .alert-row:first-child{border-top:0;}
  .alert-row>i{width:9px;height:9px;margin-top:6px;border-radius:50%;background:var(--line-strong);}
  .alert-row.unread>i{background:var(--orange);box-shadow:0 0 0 4px rgba(242,153,74,.16);}
  .alert-row strong{display:block;font-size:.86rem;}
  .alert-row small{display:block;margin-top:3px;color:var(--text-soft);font-size:.77rem;line-height:1.45;}
  .alert-row .when{color:var(--text-faint);font-size:.71rem;}
  @media (max-width:640px){
    .avatar-edit{gap:14px;}
    .avatar-preview{width:64px;height:64px;font-size:1.5rem;}
  }

  /* ---- live delivery tracking ---- */
  .track-panel{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,.8fr);gap:0;margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);}
  .track-map-wrap{position:relative;min-height:420px;}
  #routeMap{position:absolute;inset:0;}
  .track-live{position:absolute;z-index:500;top:14px;left:14px;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:rgba(11,31,22,.86);color:var(--paper);font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;}
  .track-live i{width:7px;height:7px;border-radius:50%;background:#7ED957;animation:livePulse 1.6s ease-in-out infinite;}
  @keyframes livePulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(126,217,87,.6);}50%{opacity:.6;box-shadow:0 0 0 7px rgba(126,217,87,0);}}
  .track-side{display:flex;flex-direction:column;gap:18px;padding:24px;border-left:1px solid var(--line);background:var(--paper);}
  .track-eta strong{display:block;font-family:'Fraunces',serif;font-size:1.45rem;line-height:1.2;color:var(--ink);}
  .track-eta span{display:block;margin-top:5px;color:var(--text-faint);font-size:.8rem;}
  .track-stages{list-style:none;margin:0;padding:0;display:grid;}
  .track-stage{position:relative;display:grid;grid-template-columns:20px 1fr;gap:12px;padding:0 0 22px;}
  .track-stage:last-child{padding-bottom:0;}
  .track-stage::before{content:"";position:absolute;left:9px;top:18px;bottom:0;width:2px;background:var(--line-strong);}
  .track-stage:last-child::before{display:none;}
  .track-stage.done::before{background:var(--leaf);}
  .track-stage>i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);z-index:1;}
  .track-stage.done>i{background:var(--leaf);border-color:var(--leaf);}
  .track-stage.live>i{background:var(--orange);border-color:var(--orange);box-shadow:0 0 0 5px rgba(242,153,74,.18);animation:livePulse 1.8s ease-in-out infinite;}
  .track-stage strong{display:block;font-size:.88rem;color:var(--text-faint);}
  .track-stage.done strong,.track-stage.live strong{color:var(--ink);}
  .track-stage span span{display:block;margin-top:2px;color:var(--text-faint);font-size:.75rem;line-height:1.4;}
  .track-meta{color:var(--text-faint);font-size:.76rem;}
  .track-side .btn{margin-top:auto;align-self:flex-start;}
  .eco-pin{display:grid;place-items:center;width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);font-size:15px;box-shadow:0 6px 16px -6px rgba(21,35,26,.7);}
  .eco-pin>*{transform:rotate(45deg);}
  .eco-pin-pickup{background:#FFFDF6;border:2px solid var(--leaf);}
  .eco-pin-drop{background:#FFFDF6;border:2px solid var(--orange);}
  .eco-driver{position:relative;display:grid;place-items:center;width:44px;height:44px;}
  .eco-driver-body{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--surface);border:2px solid var(--orange);font-size:18px;box-shadow:0 8px 20px -8px rgba(21,35,26,.8);transition:transform .5s ease;}
  .eco-driver-pulse{position:absolute;inset:0;border-radius:50%;background:rgba(242,153,74,.28);animation:livePulse 1.8s ease-in-out infinite;}
  @media (max-width:900px){
    .track-panel{grid-template-columns:1fr;}
    .track-map-wrap{min-height:320px;}
    .track-side{border-left:0;border-top:1px solid var(--line);}
  }
  @media (prefers-reduced-motion:reduce){
    .track-live i,.track-stage.live>i,.eco-driver-pulse{animation:none;}
    .eco-driver-body{transition:none;}
  }
  .geo-field select[disabled]{opacity:.62;cursor:not-allowed;background:rgba(21,35,26,.04);}
  .geo-note{display:block;font-size:.78rem;font-style:normal;color:var(--text-faint);margin-top:6px;}
  .geo-note:empty{display:none;}
  .geo-note.warn{color:#B94735;}
  .geo-field.invalid select,.geo-field.invalid input{border-color:var(--tomato);box-shadow:0 0 0 4px rgba(225,87,63,.14);}
  .empty-state{padding:48px 22px;text-align:center;background:var(--sage);border:1px dashed var(--line-strong);border-radius:18px;}
  .empty-state h2{font-size:1.35rem;margin-bottom:8px;}
  .empty-state p{max-width:45ch;margin:0 auto 18px;color:var(--text-soft);font-size:.86rem;}
  .toast{position:fixed;right:24px;bottom:24px;z-index:100;max-width:360px;padding:13px 17px;background:var(--bg-deep);color:var(--paper);border:1px solid rgba(139,195,74,.3);border-radius:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .25s ease,transform .25s var(--ease);font-size:.82rem;}
  .toast.show{opacity:1;transform:none;}
  .mobile-menu{display:none;}

  @media (max-width:1100px){
    .app-shell{grid-template-columns:232px minmax(0,1fr);}
    .home-grid,.view-board{grid-template-columns:1fr;}
    .home-secondary{grid-template-columns:repeat(3,1fr);align-items:start;}
    .ai-stack{grid-column:1 / -1;grid-template-columns:repeat(3,1fr);}
  }
  @media (max-width:980px){
    .app-shell{display:block;}
    .sidebar{position:fixed;left:0;top:0;width:264px;transform:translateX(-102%);transition:transform .3s var(--ease);box-shadow:20px 0 50px -35px rgba(21,35,26,.8);}
    .sidebar.is-open{transform:none;}
    .mobile-menu{display:inline-flex;width:42px;height:42px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--ink);}
    .mobile-menu svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;}
    .app-mobile-bar{position:sticky;top:0;z-index:55;display:flex;align-items:center;gap:12px;padding:12px 20px;background:rgba(242,239,226,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(14px);}
    .app-mobile-bar .brand{margin-right:auto;}
    .app-mobile-bar .brand img{height:25px;}
    .app-topbar{top:0;}
    .top-context{display:none;}
    .home-secondary{grid-template-columns:1fr;}
    .ai-stack{grid-template-columns:1fr;}
  }
  @media (max-width:720px){
    .app-topbar{padding:12px 20px;}
    .app-topbar>.top-account{display:none;}
    .greeting,.view-intro{align-items:flex-start;flex-direction:column;padding:34px 0 24px;}
    .greeting .btn,.view-intro .btn{width:100%;}
    .impact-ledger{grid-template-columns:repeat(2,1fr);}
    .impact-cell:nth-child(2){border-right:0;}
    .impact-cell:nth-child(-n+2){border-bottom:1px solid var(--line);}
    .offer-row{grid-template-columns:10px minmax(0,1fr) auto;gap:10px;}
    .offer-qty{grid-column:2;text-align:left;}
    .offer-row .time-chip{grid-column:3;grid-row:1;}
    .offer-row .offer-action,.offer-row .claimed-state{grid-column:2 / -1;justify-self:start;}
    .category-picker{grid-template-columns:repeat(2,1fr);}
    .route-board{grid-template-columns:1fr;}
    .detail-grid{grid-template-columns:1fr;}
    .search-shortcut{display:none;}
  }
  @media (max-width:520px){
    .app-content{padding-left:20px;padding-right:20px;}
    .impact-cell{padding:16px 14px;}
    .sheet{padding:19px 16px;}
    .sheet-head{display:block;}
    .filter-tabs{margin-top:15px;}
    .toast{right:16px;left:16px;bottom:16px;max-width:none;}
  }
  @media (prefers-reduced-motion:reduce){
    .side-link:hover,.offer-row:hover,.ai-note:hover,.category-choice:hover,.btn:hover:not(:active):not(:disabled){transform:none;}
    .time-chip.urgent{animation:none;}
    .search-results{animation:none;}
  }
</style>

<script>
(async () => {
  const reduceMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  let reduceMotion = reduceMotionQuery.matches;
  if(reduceMotionQuery.addEventListener) reduceMotionQuery.addEventListener('change', () => { reduceMotion = reduceMotionQuery.matches; });
  const preview = new URLSearchParams(window.location.search).has('preview');
  let session = null;
  let profile = {full_name:'Priya Menon',city:'Visakhapatnam',role:'org'};

  if(!preview){
    const sessionResult = await sb.auth.getSession();
    session = sessionResult.data.session;
    if(!session){ window.location.replace('signin.html'); return; }
    const profileResult = await sb.from('profiles').select('*').eq('id', session.user.id).single();
    if(profileResult.error || !profileResult.data){ window.location.replace('signup.html'); return; }
    profile = {...profileResult.data, full_name:profileResult.data.full_name || session.user.email};
  }

  const firstName = (profile.full_name || 'Friend').split(' ')[0];
  const roleNames = {donor:'Food donor',org:'Receiving organisation',driver:'Volunteer driver'};
  const roleName = roleNames[profile.role] || 'EcoBite member';
  const initial = firstName.charAt(0).toUpperCase();
  ['sideCity','topCity'].forEach(id => document.getElementById(id).textContent = profile.city || 'Your city');
  ['sideName','topName'].forEach(id => document.getElementById(id).textContent = profile.full_name || 'EcoBite member');
  ['sideRole','topRole'].forEach(id => document.getElementById(id).textContent = roleName);
  ['sideAvatar','topAvatar','mobileAvatar'].forEach(id => document.getElementById(id).textContent = initial);

  // ---- profile photo in the sidebar / top bar ----------------------------
  function setHeaderAvatar(url){
    ['sideAvatar','topAvatar','mobileAvatar'].forEach(id => {
      const node = document.getElementById(id);
      if(!node) return;
      node.innerHTML = url ? `<img src="${escapeHtml(url)}" alt="">` : '';
      if(!url) node.textContent = initial;
      node.classList.toggle('has-photo', !!url);
    });
  }
  setHeaderAvatar(profile.avatar_url);

  // ---- "food donated near me" alerts -------------------------------------
  // The database trigger in supabase-schema.sql writes a notifications row for
  // every receiver in the same district the moment a donor flags food. This
  // listens for those rows over Realtime, so the alert lands without a refresh.
  let alertChannel = null;

  async function askNotificationPermission(){
    if(!('Notification' in window) || Notification.permission !== 'default') return;
    try { await Notification.requestPermission(); } catch (_) {}
  }

  function popNotification(row){
    showToast(`${row.title} — ${row.body}`);
    if('Notification' in window && Notification.permission === 'granted'){
      const alert = new Notification(row.title, { body: row.body, icon: 'logo-icon.webp', tag: row.id });
      alert.onclick = () => { window.focus(); renderView('receive'); };
    }
    const list = document.getElementById('alertList');
    if(list) void loadAlerts();
  }

  async function loadAlerts(){
    const list = document.getElementById('alertList');
    if(!list || !session) return;
    const { data, error } = await sb.from('notifications')
      .select('*').order('created_at', { ascending: false }).limit(6);
    if(error){ list.innerHTML = `<p class="empty-note">${escapeHtml(error.message)}</p>`; return; }
    if(!data?.length){ list.innerHTML = '<p class="empty-note">No alerts yet. You will hear from us when food is flagged in your district.</p>'; return; }
    list.innerHTML = `<div class="alert-list">${data.map(row => `<article class="alert-row ${row.read_at ? '' : 'unread'}"><i></i><span><strong>${escapeHtml(row.title)}</strong><small>${escapeHtml(row.body)}</small><small class="when">${new Date(row.created_at).toLocaleString()}</small></span></article>`).join('')}</div>`;
    const unread = data.filter(row => !row.read_at).map(row => row.id);
    if(unread.length) void sb.from('notifications').update({ read_at: new Date().toISOString() }).in('id', unread);
  }

  function watchNearbyAlerts(){
    if(!session) return;

  // ---------- Live weather signal (Open-Meteo — free, key-free, no connector needed) ----------
  // Feeds the "Today's weather" card on the Surplus forecast view. Fails quietly:
  // the rest of the forecast view already stands on its own without it.
  const WMO_RAIN_CODES = new Set([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99]);
  const WMO_DESCRIPTIONS = {
    0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Freezing fog',
    51:'Light drizzle',53:'Moderate drizzle',55:'Dense drizzle',56:'Light freezing drizzle',57:'Dense freezing drizzle',
    61:'Slight rain',63:'Moderate rain',65:'Heavy rain',66:'Light freezing rain',67:'Heavy freezing rain',
    71:'Slight snow',73:'Moderate snow',75:'Heavy snow',77:'Snow grains',
    80:'Slight rain showers',81:'Moderate rain showers',82:'Violent rain showers',85:'Slight snow showers',86:'Heavy snow showers',
    95:'Thunderstorm',96:'Thunderstorm, slight hail',99:'Thunderstorm, heavy hail'
  };
  let weatherSignal = null;   // {code, tempMax, rainProbability, locLabel, kind}
  let weatherLoading = false;

  async function geocodeCity(name) {
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=en&format=json`;
    const response = await fetch(url);
    const data = await response.json().catch(() => null);
    const hit = data && data.results && data.results[0];
    if (!hit) throw new Error('Location not found.');
    return { latitude: hit.latitude, longitude: hit.longitude, label: [hit.name, hit.country].filter(Boolean).join(', ') };
  }

  async function fetchTodayWeather(lat, lon) {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weather_code,temperature_2m_max,precipitation_probability_max&forecast_days=1&timezone=auto`;
    const response = await fetch(url);
    const data = await response.json();
    const d = data.daily;
    if (!d || !d.time || !d.time.length) throw new Error('No forecast returned.');
    return {
      code: d.weather_code[0],
      tempMax: d.temperature_2m_max[0],
      rainProbability: (d.precipitation_probability_max && d.precipitation_probability_max[0] != null) ? d.precipitation_probability_max[0] : null
    };
  }

  function classifyWeather(day) {
    if (!day) return 'clear';
    if (WMO_RAIN_CODES.has(day.code)) return 'rain';
    if (typeof day.tempMax === 'number' && (day.tempMax >= 40 || day.tempMax <= 5)) return 'extreme';
    return 'clear';
  }

  function applyWeatherSignal() {
    const pillEl = document.getElementById('weatherPillForecast');
    if (!pillEl) return; // forecast view isn't mounted right now
    const locLine = document.getElementById('weatherLocLine');
    const tempCell = document.getElementById('weatherTempCell');
    const rainCell = document.getElementById('weatherRainCell');
    const note = document.getElementById('weatherNote');
    if (weatherLoading) {
      pillEl.textContent = 'Loading';
      pillEl.className = 'pill pill-quiet';
      locLine.textContent = `Checking conditions in ${profile.city || 'your area'}…`;
      return;
    }
    if (!weatherSignal) {
      pillEl.textContent = 'Unavailable';
      pillEl.className = 'pill pill-quiet';
      locLine.textContent = profile.city
        ? `Could not reach the live weather source for ${profile.city} — plan around the pattern alongside this.`
        : 'Add a city in Profile to see local weather here.';
      tempCell.textContent = '—';
      rainCell.textContent = '—';
      note.textContent = 'Weather comes from Open-Meteo, a free public source — no sign-in needed.';
      return;
    }
    const desc = WMO_DESCRIPTIONS[weatherSignal.code] || 'Conditions unavailable';
    const pillCopy = weatherSignal.kind === 'rain' ? 'Rain likely' : weatherSignal.kind === 'extreme' ? 'Extreme heat' : 'Clear';
    const pillClass = weatherSignal.kind === 'rain' ? 'pill-orange' : weatherSignal.kind === 'extreme' ? 'pill-tomato' : 'pill-leaf';
    pillEl.textContent = pillCopy;
    pillEl.className = 'pill ' + pillClass;
    locLine.textContent = `${desc} in ${weatherSignal.locLabel} today.`;
    tempCell.textContent = typeof weatherSignal.tempMax === 'number' ? `${Math.round(weatherSignal.tempMax)}°C` : '—';
    rainCell.textContent = weatherSignal.rainProbability != null ? `${weatherSignal.rainProbability}%` : '—';
    note.textContent = weatherSignal.kind === 'rain'
      ? 'Rain tends to pull in-person collections earlier — flag urgent pickups sooner today.'
      : weatherSignal.kind === 'extreme'
      ? 'Extreme heat shortens how long prepared food stays safe to collect — prioritise same-day pickup.'
      : 'No unusual weather today — plan around the rescue pattern alongside this.';
  }

  async function loadWeatherSignal() {
    if (!profile.city) { weatherSignal = null; applyWeatherSignal(); return; }
    weatherLoading = true;
    applyWeatherSignal();
    try {
      const place = await geocodeCity(profile.city);
      const day = await fetchTodayWeather(place.latitude, place.longitude);
      weatherSignal = { ...day, locLabel: place.label, kind: classifyWeather(day) };
    } catch (err) {
      weatherSignal = null;
    } finally {
      weatherLoading = false;
      applyWeatherSignal();
      applyPrediction();
    }
  }

  // ---------- Predictive AI outlook (weather + day-of-week calendar signal) ----------
  // A transparent, explainable heuristic — not a trained model — so the reasoning
  // shown to the user always matches the number shown to the user.
  const DAY_PATTERN = [
    { mult: .55, note: "Sundays run quiet — most kitchens are closed or low-volume." },
    { mult: .85, note: "Mondays pick back up as kitchens restock after the weekend." },
    { mult: .75, note: "Tuesdays are typically an average rescue day." },
    { mult: .95, note: "Midweek prep tends to leave more usable surplus than early week." },
    { mult: 1.35, note: "Thursdays have the strongest pattern — kitchens clear stock before the weekend rush." },
    { mult: 1.1, note: "Fridays run busy, with steady evening offers." },
    { mult: .9, note: "Saturdays are moderate, mostly from event and catering surplus." }
  ];
  const BASE_DAILY_OFFERS = 7; // baseline offers/day this network typically sees

  function predictSurplus() {
    const now = new Date();
    const dayInfo = DAY_PATTERN[now.getDay()];
    let mult = dayInfo.mult;
    let weatherNote = null, weatherBadge = '⛅ Checking weather…', confidence = 55;
    if (weatherLoading) {
      weatherBadge = '⛅ Checking weather…';
      confidence = 55;
    } else if (weatherSignal) {
      confidence = 84;
      const temp = typeof weatherSignal.tempMax === 'number' ? `${Math.round(weatherSignal.tempMax)}°C` : '';
      if (weatherSignal.kind === 'rain') {
        mult *= 1.18;
        weatherNote = 'Rain today usually pulls in-person handoffs earlier, nudging more offers into the system.';
        weatherBadge = `🌧️ Rain likely${temp ? ', ' + temp : ''}`;
      } else if (weatherSignal.kind === 'extreme') {
        mult *= 1.28;
        weatherNote = 'Extreme heat shortens how long prepared food stays safe, so more of it gets flagged rather than held.';
        weatherBadge = `🌡️ Extreme heat${temp ? ', ' + temp : ''}`;
      } else {
        weatherNote = 'Clear weather today — no unusual push on the pattern.';
        weatherBadge = `☀️ Clear${temp ? ', ' + temp : ''}`;
      }
    } else {
      weatherBadge = profile.city ? '⛅ Weather unavailable' : '⛅ Add a city for weather';
      confidence = 48;
    }
    const expected = Math.max(1, Math.round(BASE_DAILY_OFFERS * mult));
    const low = Math.max(1, Math.round(expected * .8));
    const high = Math.round(expected * 1.25);
    const dayName = now.toLocaleDateString(undefined, { weekday: 'long' });
    return {
      expected, low, high,
      headline: `Around ${low}–${high} offers may appear today.`,
      reason: [dayInfo.note, weatherNote].filter(Boolean).join(' '),
      weatherBadge,
      dayBadge: `📅 ${dayName}`,
      confidence
    };
  }

  function animateCount(el, target, duration = 900) {
    const startTime = performance.now();
    const step = now => {
      const t = Math.min(1, (now - startTime) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(target * eased);
      if (t < 1) window.requestAnimationFrame(step);
    };
    window.requestAnimationFrame(step);
  }

  // A stable "quote of the day" — same all day, changes tomorrow.

  // Reveals `text` into `el` one character at a time, like a streamed AI reply.
  function typeWriter(el, text, baseSpeed = 22) {
    el.textContent = '';
    let i = 0;
    return new Promise(resolve => {
      const step = () => {
        if (i < text.length) {
          el.textContent += text.charAt(i);
          i++;
          window.setTimeout(step, baseSpeed + Math.random() * 20);
        } else {
          resolve();
        }
      };
      step();
    });
  }

      return `<div class="empty-state"><h2>${copy[0]}</h2><p>${copy[1]}</p></div>`;
    }
    return `<div class="table-wrap"><table class="record-table"><thead><tr><th>Food</th><th>Donor</th><th>Amount</th><th>Collect by</th><th>Status</th>${mode === 'available' ? '<th></th>' : ''}</tr></thead><tbody>${offers.map(offer => `<tr><td><strong>${escapeHtml(offer.food_name)}</strong><span>${escapeHtml(offer.category)}</span></td><td>${escapeHtml(offer.donor?.org_name || offer.donor?.full_name || 'EcoBite donor')}</td><td>${escapeHtml(offer.quantity)} ${escapeHtml(offer.unit)}</td><td>${escapeHtml(offer.collect_by)}</td><td><span class="status-text ${offer.status === 'open' ? 'waiting' : 'done'}">${escapeHtml(offer.status)}</span></td>${mode === 'available' ? `<td><div class="row-actions"><button class="btn btn-leaf btn-sm" data-claim-offer="${offer.id}">Claim</button>${offer.pickup_latitude ? `<button class="btn btn-outline btn-sm" data-offer-map="${offer.id}">🗺️ Live map</button>` : ''}</div></td>` : ''}</tr>`).join('')}</tbody></table></div>`;
  };

  const loadOffers = async (mode) => {
    const target = document.getElementById(mode === 'available' ? 'receiveOfferList' : 'recordList');
    if (!target || !session) return;
    let query = sb.from('food_offers').select('*, donor:profiles!food_offers_donor_id_fkey(full_name,org_name)').order('created_at', { ascending: false });
    // ilike (no wildcards) matches the district however it was capitalised.
    if (mode === 'available') query = query.eq('status', 'open').ilike('city', profile.city || '');
    if (mode === 'donations') query = query.eq('donor_id', session.user.id);
    if (mode === 'receives') query = query.eq('recipient_id', session.user.id);
    const { data, error } = await query;
    if (error) { target.innerHTML = `<p class="empty-note">${escapeHtml(error.message)}</p>`; return; }

    }

      claimOffer = (data || []).find(offer => offer.id === button.dataset.claimOffer) || null;
      renderView('claim');

  // ---- live map for a single offer: pickup pin + your moving position ----
  let offerMap = null, offerWatch = null;
  const closeOfferMap = () => {
    if (offerWatch !== null) { navigator.geolocation.clearWatch(offerWatch); offerWatch = null; }

  };
  const showOfferMap = (offer, mount) => {
    closeOfferMap();
    const pickup = [Number(offer.pickup_latitude), Number(offer.pickup_longitude)];
    mount.insertAdjacentHTML('beforeend', `<section class="sheet offer-map-panel" id="offerMapPanel">
      <div class="sheet-head"><div><h2>${escapeHtml(offer.food_name)} — pickup point</h2><p>${escapeHtml(offer.pickup_landmark || 'Exact coordinates shared by the donor.')}</p></div><button class="btn btn-ghost btn-sm" id="offerMapClose">Close map</button></div>
      <div class="gps-map-wrap" style="height:340px"><div class="gps-map" id="offerMap"></div><span class="gps-live-badge" id="offerMapBadge" hidden><i></i>Live GPS</span></div>
      <div class="gps-readout"><span class="gps-coord"><small>Latitude</small><strong>${escapeHtml(offer.pickup_latitude)}</strong></span><span class="gps-coord"><small>Longitude</small><strong>${escapeHtml(offer.pickup_longitude)}</strong></span><span class="gps-coord"><small>Distance from you</small><strong id="offerMapDistance">—</strong></span></div>
      <p class="gps-note" id="offerMapNote">Turn on live tracking to watch your own position move towards the pickup point.</p>
      <div class="gps-actions" style="margin-top:12px"><button type="button" class="btn btn-leaf btn-sm" id="offerMapTrack">🛰️ Track me live</button><a class="btn btn-outline btn-sm" target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${pickup[0]}&mlon=${pickup[1]}#map=17/${pickup[0]}/${pickup[1]}">Open directions</a></div>
    </section>`);
    const panel = document.getElementById('offerMapPanel');
    offerMap = L.map(document.getElementById('offerMap'), { scrollWheelZoom: false }).setView(pickup, 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors', maxZoom: 19 }).addTo(offerMap);
    L.marker(pickup, { icon: L.divIcon({ className: 'eco-pin-wrap', html: '<span class="eco-pin eco-pin-pickup">🍲</span>', iconSize: [34, 34], iconAnchor: [17, 17] }) }).addTo(offerMap).bindPopup('Pickup point');
    window.setTimeout(() => offerMap.invalidateSize(), 140);

    let meMarker = null, meLine = null;
    document.getElementById('offerMapTrack').addEventListener('click', event => {
      if (offerWatch !== null) {
        navigator.geolocation.clearWatch(offerWatch); offerWatch = null;
        document.getElementById('offerMapBadge').hidden = true;
        event.currentTarget.textContent = '🛰️ Track me live';
        return;
      }
      if (!navigator.geolocation) { document.getElementById('offerMapNote').textContent = 'This browser cannot read GPS.'; return; }
      document.getElementById('offerMapBadge').hidden = false;
      event.currentTarget.textContent = '⏹ Stop tracking';
      offerWatch = navigator.geolocation.watchPosition(position => {
        const me = [position.coords.latitude, position.coords.longitude];
        if (!meMarker) {
          meMarker = L.marker(me, { icon: L.divIcon({ className: 'eco-driver-wrap', html: '<span class="eco-driver"><b class="eco-driver-pulse"></b><b class="eco-driver-body">🧍</b></span>', iconSize: [44, 44], iconAnchor: [22, 22] }) }).addTo(offerMap);
          meLine = L.polyline([me, pickup], { color: '#F2994A', weight: 3, dashArray: '4 9' }).addTo(offerMap);
          offerMap.fitBounds([me, pickup], { padding: [50, 50], maxZoom: 16 });
        } else {
          meMarker.setLatLng(me);
          meLine.setLatLngs([me, pickup]);
        }
        // Straight-line distance, refreshed with every GPS reading.
        const R = 6371000, rad = deg => deg * Math.PI / 180;
        const dLat = rad(pickup[0] - me[0]), dLng = rad(pickup[1] - me[1]);
        const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(me[0])) * Math.cos(rad(pickup[0])) * Math.sin(dLng / 2) ** 2;
        const metres = 2 * R * Math.asin(Math.sqrt(h));

        document.getElementById('offerMapNote').textContent = 'Your position updates as you move. The dashed line is the direct distance to the food.';
      }, () => { document.getElementById('offerMapNote').textContent = 'Location permission was not granted.'; }, { enableHighAccuracy: true, maximumAge: 8000, timeout: 20000 });

  const renderView = view => {

ow much surplus food is likely to appear today.</p><div class="predict-badges"><span class="predict-badge" id="predictWeatherBadge">⛅ Checking weather…</span><span class="predict-badge" id="predictDayBadge">📅 —</span></div><div class="predict-meter"><i id="predictMeterFill"></i></div><div class="predict-meter-label"><span>Prediction confidence</span><span id="predictConfidenceLabel">—</span></div></article></aside></div></section>`;

      }).eq('id', claimOffer.id).eq('status', 'open').is('recipient_id', null);

    } catch(error) { target.innerHTML=`<p class="empty-note">${escapeHtml(error.message)}</p>`; }
  };
  const loadDeliveries = async () => { const target=document.getElementById('deliveryRows'); if(!target) return; try { const data=await ecoApi('/v1/deliveries/mine'); target.innerHTML=data.deliveries.length?`<div class="offer-list">${data.deliveries.map(j=>`<article class="offer-row"><span><h3>${escapeHtml(j.donor_name)} → ${escapeHtml(j.receiver_name)}</h3><span class="where">${escapeHtml(j.food_summary || 'Food delivery')} · ${j.status}</span></span><button class="btn btn-outline btn-sm" data-route="${j.id}">View route</button>${(profile.role==='donor'||profile.role==='org')&&j.status!=='delivered'&&j.status!=='cancelled'?`<button class="btn btn-outline btn-sm" data-cancel="${j.id}">Cancel</button>`:''}${profile.role==='driver'&&j.driver_id===session.user.id&&j.status==='claimed'?`<button class="btn btn-leaf btn-sm" data-status="${j.id}" data-next="in_progress">Start</button>`:''}${profile.role==='driver'&&j.driver_id===session.user.id&&j.status==='in_progress'?`<button class="btn btn-leaf btn-sm" data-status="${j.id}" data-next="delivered">Deliver</button><button class="btn btn-outline btn-sm" data-track="${j.id}">Share GPS</button>`:''}</article>`).join('')}</div>`:'<p class="empty-note">No deliveries assigned to you yet.</p>'; target.querySelectorAll('[data-status]').forEach(b=>b.addEventListener('click',async()=>{try{await ecoApi(`/v1/deliveries/${b.dataset.status}/status`,{method:'POST',body:JSON.stringify({status:b.dataset.next})});showToast('Delivery updated.');void loadDeliveries();}catch(e){showToast(e.message)}})); target.querySelectorAll('[data-cancel]').forEach(b=>b.addEventListener('click',async()=>{if(!confirm('Cancel this delivery request?'))return;try{await ecoApi(`/v1/deliveries/${b.dataset.cancel}/status`,{method:'POST',body:JSON.stringify({status:'cancelled'})});showToast('Delivery cancelled.');void loadDeliveries();}catch(e){showToast(e.message)}})); target.querySelectorAll('[data-route]').forEach(b=>b.addEventListener('click',()=>void showRoute(b.dataset.route))); target.querySelectorAll('[data-track]').forEach(b=>b.addEventListener('click',()=>{
      // Driver side of the map: broadcasts GPS only while this delivery runs.
      if(EcoTracking.sharing.watchId === null && !confirm('Share your live location with the donor and receiver until this delivery is complete?')) return;
      const on = EcoTracking.shareLocation({
        sb, ecoApi, session, jobId: b.dataset.track,
        onUpdate: live => { b.textContent = live ? 'Stop sharing GPS' : 'Share GPS'; b.classList.toggle('btn-leaf', live); },
        onError: message => showToast(message)
      });
      showToast(on ? 'Sharing your live location for this delivery.' : 'Location sharing stopped.');
    })); }catch(error){target.innerHTML=`<p class="empty-note">${escapeHtml(error.message)}</p>`;} };
  // ---- live delivery tracking (see live-tracking.js) ----------------------
  let tracker = null;
  const showRoute = async jobId => {
    const panel = document.getElementById('routePanel');
    panel.hidden = false;
    if (tracker) tracker.stop();
    tracker = new EcoTracking.DeliveryTracker({
      sb, ecoApi, session, profile, jobId,
      els: {
        map: document.getElementById('routeMap'),
        eta: document.getElementById('trackEta'),
        stages: document.getElementById('trackStages'),
        meta: document.getElementById('trackMeta')
      }
    });
    document.getElementById('trackClose').onclick = () => { tracker?.stop(); tracker = null; panel.hidden = true; };
    panel.scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' });
    try { await tracker.start(); }
    catch (error) { document.getElementById('trackEta').innerHTML = `<strong>Could not load tracking</strong><span>${escapeHtml(error.message)}</span>`; }
  };
  const escapeHtml = value => String(value).replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
  const renderSearch = async query => {
    const results = document.getElementById('searchResults');
    const clean = query.trim().toLowerCase();
    if(!clean){ results.classList.remove('show'); results.innerHTML = ''; return; }
    const matches = SEARCH_INDEX.filter(item => `${item.title} ${item.meta} ${item.type}`.toLowerCase().includes(clean));
    // Receivers get live donor results from the backend in the same existing
    // search popover. Static dashboard results remain available if the API is
    // not running yet or this is preview mode.
    if(!preview && profile.role === 'org' && profile.city) {
      try {
        const data = await ecoApi(`/v1/network/donors?city=${encodeURIComponent(profile.city)}&q=${encodeURIComponent(clean)}`);
        if(document.getElementById('globalSearch').value.trim().toLowerCase() !== clean) return;
        data.donors.forEach(donor => matches.push({
          type:'Registered donors', title:donor.name, meta:[donor.org_kind, donor.city].filter(Boolean).join(' · '), view:'receive'
        }));
      } catch(error) {
        console.info('Live donor search is unavailable:', error.message);
      }
    }
    if(!matches.length){ results.innerHTML = '<p class="empty-note">No offer, pickup, or location matched that search.</p>'; results.classList.add('show'); return; }
    const groups = matches.reduce((all,item) => { (all[item.type] ||= []).push(item); return all; }, {});
    results.innerHTML = Object.entries(groups).map(([type,items]) => `<div class="search-group"><strong>${escapeHtml(type)}</strong>${items.map(item => `<button class="search-result" data-search-view="${escapeHtml(item.view)}" data-search-target="${escapeHtml(item.target || '')}"><span><strong>${escapeHtml(item.title)}</strong><span>${escapeHtml(item.meta)}</span></span></button>`).join('')}</div>`).join('');
    results.classList.add('show');
    results.querySelectorAll('.search-result').forEach(button => button.addEventListener('click', () => { const view = button.dataset.searchView; const target = button.dataset.searchTarget; renderView(view); if(target) setTimeout(() => document.getElementById(target)?.scrollIntoView({block:'center',behavior:reduceMotion?'auto':'smooth'}), 60); results.classList.remove('show'); }));
  };
  document.getElementById('globalSearch').addEventListener('input', event => { void renderSearch(event.target.value); });
  document.addEventListener('keydown', event => { if(event.key === '/' && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){ event.preventDefault(); document.getElementById('globalSearch').focus(); } if(event.key === 'Escape') document.getElementById('searchResults').classList.remove('show'); });
  document.addEventListener('click', event => { if(!event.target.closest('.search-wrap')) document.getElementById('searchResults').classList.remove('show'); });
  const sidebar = document.getElementById('sidebar');
  document.getElementById('mobileMenu').addEventListener('click', event => { const open = sidebar.classList.toggle('is-open'); event.currentTarget.setAttribute('aria-expanded', String(open)); });
  document.querySelectorAll('.side-link[data-view]').forEach(button => button.addEventListener('click', () => { sidebar.classList.remove('is-open'); document.getElementById('mobileMenu').setAttribute('aria-expanded','false'); renderView(button.dataset.view); }));
  document.getElementById('signOutLink').addEventListener('click', async () => { if(session) await sb.auth.signOut(); window.location.href = 'index.html'; });
  // ---- subtle pointer tilt on the AI cards, desktop-only, motion-safe ----
  const canTilt = !reduceMotion && window.matchMedia('(pointer:fine)').matches;
  if (canTilt) {
    document.addEventListener('pointermove', event => {
      const card = event.target.closest?.('.predict-card,.ai-note');
      if (!card) return;
      const rect = card.getBoundingClientRect();
      const px = (event.clientX - rect.left) / rect.width - .5;
      const py = (event.clientY - rect.top) / rect.height - .5;
      card.style.transform = `perspective(700px) rotateX(${(-py * 4).toFixed(2)}deg) rotateY(${(px * 4).toFixed(2)}deg) translateY(-2px)`;
    });
    document.addEventListener('pointerout', event => {
      const card = event.target.closest?.('.predict-card,.ai-note');
      if (card) card.style.transform = '';
    });
  }
  renderView(currentView);
  void loadWeatherSignal();
})();
</script>
<script src="eco-motion.js"></script>
</body>
</html>
